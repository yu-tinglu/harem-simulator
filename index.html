function tickArc(A,c,TB,kind,who,evs){if(!A||A.done)return;if(S.t-A.t<A.w)return;const arc=TB[A.k],st=arc&&arc.st[A.s];if(!st){A.done=1;return}

const AUTOK='shengong_auto';let _asK='';
function autoSave(){try{if(!S)return;if(S.over){stg.del(AUTOK);_asK='';return}if(S.ev||S.ch||S.scn||(S.q&&S.q.length))return;const k=S.t+'|'+S.w;if(k===_asK)return;_asK=k;const sum=`${S.me.n}・${S.reg?S.reg.title:RKD(S.me)}・第${Math.floor(S.t/12)+1}年${S.t%12+1}月`;stg.set(AUTOK,JSON.stringify({sum,time:new Date().toLocaleString('zh-TW',{hour12:false}),data:snap()}))}catch(e){}}
function autoCard(){const r=stg.get(AUTOK);if(!r)return'';let j;try{j=JSON.parse(r)}catch(e){return''}return`<div class=cd><h3>繼續上次的遊戲</h3><div class=m>${j.sum}<br>${j.time}（自動存檔）</div><p><button onclick="loadAuto()">繼續遊戲</button> <button class=s onclick="stg.del(AUTOK);intro()">放棄</button></p></div>`}
function loadAuto(){try{const o=JSON.parse(JSON.parse(stg.get(AUTOK)).data);if(o.ver!==1||!o.S||!o.S.me)throw 0;restore(o);_asK='';render()}catch(e){stg.del(AUTOK);intro()}}
function avFix(){try{document.documentElement.style.setProperty('--hb','url('+AVS[AVI]+')');document.querySelectorAll('img[data-av]').forEach(i=>{if(i.getAttribute('src')!==AVS[AVI])i.src=AVS[AVI]})}catch(e){}}
let _ntT=0;
function ntfAdd(t,k){(S.nt=S.nt||[]).push({t,k,ts:Date.now()});if(S.nt.length>12)S.nt.shift()}
function ntfDraw(){let e=document.getElementById('ntf');if(e)e.remove();clearTimeout(_ntT);if(!S||!S.nt||!S.nt.length)return;
const all=S.nt,show=all.slice(-3);e=document.createElement('div');e.id='ntf';
e.innerHTML=(all.length>3?`<div class="nc more">還有 ${all.length-3} 則較早的通知（都記在「紀事」裡）</div>`:'')+show.map(n=>`<div class="nc ${n.k}">${n.t}</div>`).join('')+'<button onclick="S.nt=[];ntfDraw()">知道了</button>';document.body.appendChild(e);
_ntT=setTimeout(()=>{if(!S||!S.nt)return;const now=Date.now();S.nt=S.nt.filter(n=>n.k=='me'||n.k=='medn'||(n.ts&&now-n.ts<20000));ntfDraw()},21000)}
let HELP=[];
function helpOpen(){let e=document.getElementById('help');if(e)e.remove();e=document.createElement('div');e.id='help';e.innerHTML=`<div class=hb><h3>新手說明</h3>${HELP.map((h,i)=>`<details ${i==0?'open':''}><summary>${h[0]}</summary><p>${h[1]}</p></details>`).join('')}<button onclick="document.getElementById('help').remove()">我知道了</button></div>`;document.body.appendChild(e);stg.set('hg_help','1')}
function helpFirst(){if(S&&!S.over&&S.t==0&&!stg.get('hg_help')){helpOpen()}}
const _rd3=render;render=function(){_rd3();try{avFix();autoSave();if(S)helpFirst()}catch(e){console.log(e)}};
/* ===== v37 玩家上傳畫像 ===== */
const AVDEF=AVS[0];let AVPOS=[50,25],AVMSG='';
try{const s=localStorage.getItem('hg_avatar');if(s&&s.startsWith('data:image/'))AVS[0]=s;const p=JSON.parse(localStorage.getItem('hg_avpos')||'null');if(Array.isArray(p)&&p.length==2)AVPOS=p}catch(e){}
function avPosApply(){try{document.documentElement.style.setProperty('--avpos',AVPOS[0]+'% '+AVPOS[1]+'%')}catch(e){}}
function avRefresh(){avFix();avPosApply();if(S)render();else intro()}
function avUpload(inp){const f=inp.files&&inp.files[0];if(!f)return;AVMSG='';if(!/^image\//.test(f.type)){AVMSG='請選擇圖片檔（jpg、png 等）。';return avRefresh()}if(f.size>20*1024*1024){AVMSG='圖片太大了，請選 20MB 以內的。';return avRefresh()}
const fr=new FileReader();fr.onerror=()=>{AVMSG='無法讀取這個檔案。';avRefresh()};fr.onload=()=>{const im=new Image();im.onerror=()=>{AVMSG='無法讀取這張圖片，請換一張。';avRefresh()};im.onload=()=>{try{const sc=Math.min(1,640/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const u=c.toDataURL('image/jpeg',.84);AVS[0]=u;AVPOS=[50,25];AVMSG='已換成你的畫像。可用下方滑桿調整顯示位置。';try{localStorage.setItem('hg_avatar',u);localStorage.setItem('hg_avpos',JSON.stringify(AVPOS))}catch(e){AVMSG='畫像已套用，但此環境無法永久保存，關閉頁面後會還原。'}}catch(e){AVMSG='處理圖片時出錯，請換一張。'}avRefresh()};im.src=fr.result};fr.readAsDataURL(f);inp.value=''}
function avReset(){AVS[0]=AVDEF;AVPOS=[50,25];AVMSG='已恢復預設畫像。';try{localStorage.removeItem('hg_avatar');localStorage.removeItem('hg_avpos')}catch(e){}avRefresh()}
function avMove(i,v){AVPOS[i]=+v;avPosApply();try{localStorage.setItem('hg_avpos',JSON.stringify(AVPOS))}catch(e){}}
function avPanel(){return`<div class=cd><h3>我的畫像</h3><div class=m>可以上傳自己的圖片當作主角畫像。圖片只存在你自己的瀏覽器，不會傳給任何人；請使用你有權使用的圖片。</div><p><button onclick="document.getElementById('avfile').click()">上傳畫像</button> <button class=s onclick="avReset()">恢復預設</button><input id=avfile type=file accept="image/*" hidden onchange="avUpload(this)"></p><div class=avs><label>水平位置<input type=range min=0 max=100 value=${AVPOS[0]} oninput="avMove(0,this.value)"></label><label>垂直位置<input type=range min=0 max=100 value=${AVPOS[1]} oninput="avMove(1,this.value)"></label></div>${AVMSG?`<div class=m style="margin-top:6px;color:var(--verm2)">${AVMSG}</div>`:''}</div>`}
avPosApply();

Object.keys(PT).forEach(n=>{const o=PT[n];o.src=o.def;try{const s=localStorage.getItem(o.k);if(s&&s.startsWith('data:image/'))o.src=s;const p=JSON.parse(localStorage.getItem(o.pk)||'null');if(Array.isArray(p)&&p.length==2)o.pos=p}catch(e){}});
function ptPos(){try{Object.keys(PT).forEach(n=>document.documentElement.style.setProperty('--pos-'+n,PT[n].pos[0]+'% '+PT[n].pos[1]+'%'))}catch(e){}}
function ptFix(){try{document.querySelectorAll('img[data-pt]').forEach(i=>{const s=i.dataset.pt==='me'?AVS[0]:PT[i.dataset.pt].src;if(i.getAttribute('src')!==s)i.src=s})}catch(e){}}
function ptRefresh(){ptPos();ptFix();if(S)render()}
function ptUpload(n,inp){const o=PT[n],f=inp.files&&inp.files[0];if(!f)return;o.msg='';if(!/^image\//.test(f.type)){o.msg='請選擇圖片檔（jpg、png 等）。';return ptRefresh()}if(f.size>20*1024*1024){o.msg='圖片太大了，請選 20MB 以內的。';return ptRefresh()}
const fr=new FileReader();fr.onerror=()=>{o.msg='無法讀取這個檔案。';ptRefresh()};fr.onload=()=>{const im=new Image();im.onerror=()=>{o.msg='無法讀取這張圖片，請換一張。';ptRefresh()};im.onload=()=>{try{const sc=Math.min(1,640/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const u=c.toDataURL('image/jpeg',.84);o.src=u;o.pos=[50,25];o.msg='已更換畫像，可用滑桿調整位置。';try{localStorage.setItem(o.k,u);localStorage.setItem(o.pk,JSON.stringify(o.pos))}catch(e){o.msg='畫像已套用，但此環境無法永久保存，關閉頁面後會還原。'}}catch(e){o.msg='處理圖片時出錯，請換一張。'}ptRefresh()};im.src=fr.result};fr.readAsDataURL(f);inp.value=''}
function ptReset(n){const o=PT[n];o.src=o.def;o.pos=[50,25];o.msg='已恢復預設。';try{localStorage.removeItem(o.k);localStorage.removeItem(o.pk)}catch(e){}ptRefresh()}
function ptMove(n,i,v){PT[n].pos[i]=+v;ptPos();try{localStorage.setItem(PT[n].pk,JSON.stringify(PT[n].pos))}catch(e){}}
function royalInit(){if(!S.imp)S.imp={nian:pk(NIAN),r0:R(2,14),bm:R(0,11),dm:R(0,11),dn:SUR[R(0,SUR.length-1)]+'氏'};if(S.reg&&!S.imp.rn){S.imp.rn=pk(NIAN.filter(x=>x!=S.imp.nian));S.imp.rt=S.t}}
const MON=['正','二','三','四','五','六','七','八','九','十','十一','臘'];
const yz=n=>n<=1?'元':(['','','二','三','四','五','六','七','八','九','十'][n]||n);
function ptCtl(n,label){const o=PT[n];return`<details class=ptd><summary>${label}畫像設定</summary><p><button onclick="document.getElementById('pf_${n}').click()">上傳</button> <button class=s onclick="ptReset('${n}')">恢復預設</button><input id=pf_${n} type=file accept="image/*" hidden onchange="ptUpload('${n}',this)"></p><div class=avs><label>水平<input type=range min=0 max=100 value=${o.pos[0]} oninput="ptMove('${n}',0,this.value)"></label><label>垂直<input type=range min=0 max=100 value=${o.pos[1]} oninput="ptMove('${n}',1,this.value)"></label></div>${o.msg?`<div class=m style="color:var(--verm2)">${o.msg}</div>`:''}</details>`}
function royalPanel(){royalInit();const im=S.imp,reg=!!S.reg;let ec,dc;
const bar=(l,v)=>`<div class=r><span>${l}</span><i><b style="width:${Math.max(0,Math.min(100,v))}%;background:var(--gd)"></b></i><em>${v|0}</em></div>`;
if(reg){const k=S.reg.k,y=Math.floor((S.t-(im.rt||0))/12)+1;ec=`<b>皇帝・${k.n}</b><div class=m>${im.rn}${yz(y)}年・${yr(k)}歲<br>〔${KT[k.t][0]}〕才${k.cai|0}・德${k.de|0}</div>${bar('對你孝順',k.bond)}${bar('權柄',S.reg.pw)}`;
dc=`<b>太后・${S.me.n}（你）</b><div class=m>${yr0()}歲・${S.reg.title}</div>${bar('健康',S.me.hp)}`}
else{ec=`<b>皇帝</b><div class=m>${im.nian}${yz(im.r0+Math.floor(S.t/12)+1)}年・${S.eage}歲<br>${EPS[S.ep][0]}${S.ehp<45?'・龍體欠安':''}・萬壽在${MON[im.bm]}月</div>${bar('龍體',S.ehp)}${bar('聖心',S.mood)}${bar('對你寵愛',S.me.favor)}`;
dc=S.dow?`<b>皇太后・${im.dn}</b><div class=m>${S.dow.age}歲・偏愛${dn()}<br>壽辰在${MON[im.dm]}月</div>${bar('對你好感',S.me.dw)}`:`<b>皇太后</b><div class=m>已薨逝，宮中再無人能壓制皇上。</div>`}
const pf=(n,body,srcAttr)=>`<div class=rp><div class=pfw><img class=pfi data-pt="${n}" alt=""${n=='me'?' style="object-position:var(--avpos,50% 25%)"':''}></div>${body}</div>`;
return`<div class=cd data-open=1><h3>皇室帝后</h3><div class=rgrid>${pf('emp',ec)}${pf(reg?'me':'dow',dc)}</div>${ptCtl('emp','皇帝')}${reg?'':ptCtl('dow','太后')}</div>`}
const yr0=()=>S.me.bt!==undefined?ageOf(S.me):pAge();
function bdayEv(who){const m=S.me,e=who=='emp';const t=e?`今日是皇上${S.eage}歲萬壽節，宮中設宴，各宮嬪妃紛紛獻禮。你打算獻上什麼？`:`今日是皇太后${S.dow.age}歲壽辰，慈寧宮中擺了壽宴。你打算如何賀壽？`;
const g=(f,d,txt)=>{if(e){m.favor=Math.min(100,m.favor+f);S.mood=Math.min(100,S.mood+(d||0))}else m.dw=Math.min(100,m.dw+f);return txt};
const o=e?[['親手繡一幅壽圖（耗銀15）',()=>{if(!pay(15))return g(1,0,'銀兩不足，只好隨眾道賀。');return P(cl(.55+perfB(m)/3+dfv(),.2,.9))?g(7,3,'皇上看了你繡的壽圖，連聲稱讚「有心」。'):g(2,0,'繡工稍欠火候，皇上只笑了笑。')}],
['重金購一件奇珍（耗銀50）',()=>{if(!pay(50))return g(1,0,'銀兩不足，只好隨眾道賀。');return g(8,2,'皇上很喜歡這件奇珍，當場賞了你兩匹貢緞。')}],
['獻舞獻曲，為皇上祝壽',()=>P(cl(.4+tf('perf')+perfB(m)/2+dfv(),.15,.85))?g(10,3,'你一曲驚艷全場，皇上頻頻舉杯。'):g(-1,0,'你緊張失手，場面一度尷尬。')],
['隨眾道賀，不出風頭',()=>g(1,0,'你規規矩矩行禮道賀，沒有出錯。')]]

function plPick(old){const g=['love','plot','heir','edict'];return plNew((!old&&plOrg())||g[R(0,3)],old)}
function plRun(ev){if(!S.pl)return;const ls=[S.pl];if(S.pl2)ls.push(S.pl2);else if(!S.pl2d&&(S.pl.done||S.t>=84)){const all=['love','plot','heir','edict'].concat(plOrg()?[plOrg()]:[]).filter(x=>x!==S.pl.id);S.pl2=plNew(all[R(0,all.length-1)],0);S.pl2d=1;S.pl2.nx=S.t+R(6,12);ls.push(S.pl2)}
ls.forEach(p=>{if(p.done||S.t<p.nx||!PLT[p.id]||!PLT[p.id][p.st])return;const e=PLT[p.id][p.st](p);if(e)ev.push(plWrap(e,p));else p.nx=S.t+3})}

['盟友度怎麼刷（重點）','<b>盟友度是「別人對你的好感」</b>，每位妃嬪各有一個 0～100 的數字，顯示在「後宮」分頁每個人展開後的「與你：盟友度」。你自己那一行看的是人脈，不會有盟友度，這是正常的。<br><br><b>怎麼提高：</b><br>① <b>結盟拉攏</b>（人脈勢力）：耗銀 25，對方盟友度＋12～22、敵意－6～12、你的人脈＋2。最穩定、可以重複用。<br>② <b>事件選項</b>：幫人求情、送賀禮、送安胎禮物、探病、冷宮送炭，單次常＋8～30。<br>③ <b>宮中遊歷</b>事件：選溫和、幫忙的選項，常＋10～25。<br>④ <b>同派系</b>：和你同一派系、且敵意不高的妃嬪，每月自然＋1（上限 35）。派系寫在每個人的資料裡。<br>⑤ 你成為皇后後，「掌理六宮」賞賜安撫可＋15。<br><br><b>等級：</b>10 以上點頭之交、25 以上友善、45 以上盟友、60 以上肝膽相照。<br><b>好處：</b>盟友度越高，她越不容易對你下手（敵意再扣掉盟友度的一半）、有機率在事件中替你說話或通風報信，達 45 以上會被列入你的盟友名單。<br><b>敵意</b>每月自然下降 1，「結盟拉攏」也能壓低。'],
['敵意、罪證與宮鬥','「暗中設計」可對指定妃嬪使用：散播流言（穩妥）、構陷失德、收買近侍、羅織罪證彈劾其母家、暗中蒐證、下毒、陷害子嗣、栽贓巫蠱。<br><b>罪證</b>要靠「暗中蒐證」累積，累積越多，呈交皇上降罪的成功率越高。對皇后上奏廢后需要罪證 3 條。<br><b>風險：</b>失敗會損聖寵、人脈，對方敵意上升；下毒、害子嗣失敗可能被賜死。<br>每月有機會被別人暗算，敵意高、盟友度低的人最可能對你出手。'],

const SVNF=['春','秋','香','翠','玉','紅','碧','靈','月','雲','蓮','杏','雪','錦','綠'],SVNS=['兒','蘭','桃','巧','柳','喜','荷','梅','玲','珠'];

function svMk(k,b){const t=pk(SVT);let n;for(let i=0;i<30;i++){n=k=='宮女'?pk(SVNF)+pk(SVNS):pk(SVNM);if(!(S.srv||[]).some(x=>x.n==n))break}
return{n,k,tr:t[0],lo:cl(R(45,78)+t[2]+(b||0)),ab:cl(R(25,58)+t[1]+(b||0)),job:pk(SVJ),y:S.t}}
function svNeed(){return STAFF[S.me.rank]||[2,1]}
function svInit(){if(!S||!S.me||S.srv)return;S.srv=[];const [a,b]=svNeed();for(let i=0;i<a;i++)S.srv.push(svMk('宮女'));for(let i=0;i<b;i++)S.srv.push(svMk('太監'));S.srv.forEach((x,i)=>{x.job=i<2&&x.k=='宮女'?'貼身伺候':pk(SVJ)})}
function svSync(){svInit();if(!S.srv)return;const nd=svNeed();['宮女','太監'].forEach((k,i)=>{let c=S.srv.filter(x=>x.k==k).length;while(c<nd[i]&&S.srv.length<14){const x=svMk(k);S.srv.push(x);c++;L(`內務府撥來${k}${x.n}供你使喚。`)}})}
function svBox(x){return`${x.k}${x.n}（${x.tr}・${x.job}・忠${x.lo|0} 能${x.ab|0}）`}
function svDo(x,p,okf,failf){const m=S.me;if(ckp(p+(x.lo-50)/400-(x.tr=='膽小'?.06:0)+(x.tr=='老練'?.05:0))){x.ab=cl(x.ab+.6);x.lo=cl(x.lo+1);okf()}else{x.lo=cl(x.lo-2);failf()}}
function svPickN(t,fn){choose(t,ids().map(i=>{const n=S.npcs[i];return{l:`${n.n}（${RKN(n)}・盟${n.al|0} 怨${n.host|0}）`,f(){fn(n)}}}))}

{l:'給母家送信',f(){const f=pk(m.fam);const a=f.pw|0;f.pw+=R(2,5);f.lo=cl((f.lo||50)+2);if(m.fo&&S.fr&&!S.fr.dead){S.fr.rel=cl(S.fr.rel+3)}L(`${x.n}把信帶到，${f.rel}勢力 ${a}→${f.pw|0}${m.fo&&S.fr?'，母國邦誼也回暖':''}。`)}}];return T}

const kOf=(nc,base)=>Math.max(1,Math.min(4,Math.pow(nc/base,.75)));
function snap(g){const a=[],P=(o,k)=>{if(o&&typeof o[k]==='number')a.push([o,k,o[k]])};
 try{
 if(g==='srv'){(S.srv||[]).forEach(x=>P(x,'lo'));P(S.me,'ally');(S.npcs||[]).forEach(n=>P(n,'al'))}
 else if(g==='fam'){(S.me.fam||[]).forEach(x=>{P(x,'pw');P(x,'lo');P(x,'ab')});P(S.me,'ally')}
 else if(g==='fr'){const f=S.fr;if(f)['mil','eco','stab','rel'].forEach(k=>P(f,k))}
 else if(g==='nat'){if(S.nat)Object.keys(S.nat).forEach(k=>P(S.nat,k));if(S.reg)P(S.reg,'pw');P(S.me,'ally');try{const r=ntr();Object.keys(r).forEach(k=>P(r,k))}catch(e){}}

function amp(a,k,g){if(k<=1.001)return;a.forEach(([o,key,v0])=>{const d=o[key]-v0;if(d>0)o[key]=Math.round(v0+d*k)});if(g==='fr'&&S.fr&&typeof frPw==='function')S.fr.pw=frPw(S.fr)}

function wrapPay(of,base,nc,g){return function(){const m=S.me;if(m.silver<nc){L('銀兩不足。');return}const s0=m.silver;m.silver-=nc-base;const sn=snap(g);const r=of.apply(this,arguments);if(s0-m.silver<nc){m.silver=Math.min(s0,m.silver+(nc-base))}else amp(sn,kOf(nc,base),g);return r}}

 [/普賞宮人|厚賞各宮管事|收買對手的下人/,.5,'srv'],

const _ra=regActs;regActs=function(){try{RACT.forEach(a=>{const t=RT[a[0]];if(t&&D0[a[0]])a[1]=D0[a[0]].replace(/耗銀\d+/,'耗銀'+cost(t[0],t[1]))})}catch(e){}return _ra.apply(this,arguments)};
