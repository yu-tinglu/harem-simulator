<style>
/* Layout: a fixed painted palace scene sits behind a single centered column of lacquer panels; five tabs along the bottom; events arrive as imperial scrolls. */
:root{--ink:#12060a;--lac:#2a0b10;--verm:#c8323c;--verm2:#8f1c26;--gold:#e3b45a;--gold2:#a97c2a;--cream:#f4e8cc;--mute:#c9ac8c;--jade:#62bd8f;--paper:#f3e5c3;--paper2:#e4cf9f;--seal-ink:#2a140f;--f:"Noto Serif TC","Songti TC","Noto Serif CJK TC",serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font:400 15.5px/1.7 var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100%}

.sc{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s ease}
body[data-scene=room] .sc-room,body[data-scene=court] .sc-court,body[data-scene=dusk] .sc-dusk{opacity:1}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto}
main{padding-bottom:96px}
h1,h2,h3{font-family:var(--f);margin:0}
h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:15px;font-weight:900;letter-spacing:.14em;color:var(--gold)}

.cd{position:relative;background:linear-gradient(180deg,rgba(54,14,21,.88),rgba(28,8,12,.92));border:1px solid rgba(227,180,90,.4);border-radius:3px;padding:12px 14px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 0 0 3px rgba(18,6,10,.6),inset 0 0 0 4px rgba(227,180,90,.14);min-width:0}

.sub{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}

button{font:inherit;font-size:15px;color:var(--cream);background:linear-gradient(180deg,#a82b36,#7a1822);border:1px solid var(--gold2);border-radius:3px;padding:9px 12px;cursor:pointer;text-align:left;box-shadow:inset 0 1px 0 rgba(255,222,160,.25);transition:filter .15s}

details.con{padding:0}

.kid{padding:8px 0;border-top:1px dashed rgba(227,180,90,.25)}
.kid:first-of-type{border-top:0}
.kh{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kh b{font-size:17px;letter-spacing:.1em}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:4px}
.kb>*{min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:2px;background:rgba(14,5,8,.95);border-top:1px solid rgba(227,180,90,.5);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;box-shadow:none;color:var(--mute);padding:4px 0;font-size:12px;letter-spacing:.2em}
.tabs button i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border:1px solid rgba(227,180,90,.45);border-radius:3px;font-weight:900;font-size:16px;letter-spacing:0;color:var(--gold)}
.tabs button[aria-current=true]{color:var(--gold)}
.tabs button[aria-current=true] i{background:var(--verm);border-color:var(--gold);color:#fff}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,2,4,.68);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scroll{position:relative;width:min(100%,500px);max-height:100%;overflow:auto;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--seal-ink);border-radius:2px;padding:18px 20px 14px;border-top:12px solid var(--verm2);border-bottom:12px solid var(--verm2);box-shadow:0 18px 48px rgba(0,0,0,.6),inset 0 0 0 1px rgba(120,80,40,.35)}
.scroll .tag{display:inline-block;background:var(--verm);color:#fff;font-weight:900;font-size:12px;letter-spacing:.3em;padding:2px 8px 2px 11px;margin-bottom:10px;transform:rotate(-1.5deg)}
.scroll.bad .tag{background:#5a0d14}
.scroll p{margin:0 0 12px}
.scroll h2{font-size:26px;font-weight:900;letter-spacing:.2em;color:var(--verm2);margin:0 0 10px}
.scroll .m,.scroll .m2{color:#6b4a38;font-size:13px}
.scroll .k{border-top:1px dashed rgba(42,20,15,.35);color:var(--seal-ink)}
.scroll button{display:block;width:100%;margin:6px 0;color:#fff}
.scroll button.s{background:transparent;color:#6b4a38;border-color:rgba(42,20,15,.4)}
.splash{text-align:center;padding:26px 0 4px}
.seal{display:inline-grid;place-items:center;width:46px;height:46px;background:var(--verm);color:#fff;font-weight:900;font-size:24px;border-radius:3px;transform:rotate(-4deg);box-shadow:0 2px 0 var(--verm2)}
.splash h1{margin:8px 0 0;padding-left:.35em;font-size:46px;line-height:1.15;font-weight:900;letter-spacing:.35em;background:linear-gradient(180deg,#ffeab0,#d9a441 60%,#9a6a1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.splash p{margin:4px 0 0;color:var(--cream);letter-spacing:.3em;font-size:13px}
.who{display:flex;gap:12px;align-items:center}
.wm{flex:1;min-width:0}
.av{flex:0 0 auto;width:76px;height:76px;object-fit:cover;border:2px solid var(--gold);border-radius:3px;box-shadow:0 0 0 3px rgba(18,6,10,.8),0 0 0 4px rgba(227,180,90,.45)}
.av[big]{width:104px;height:104px}
